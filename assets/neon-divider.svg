<svg width="1200" height="28" viewBox="0 0 1200 28" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dividerTitle dividerDesc">
  <title id="dividerTitle">Neon divider</title>
  <desc id="dividerDesc">A glowing neon divider line with a moving pulse.</desc>

  <defs>
    <linearGradient id="dividerLine" x1="0" y1="14" x2="1200" y2="14" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#000000" stop-opacity="0" />
      <stop offset="0.2" stop-color="#22D3EE" stop-opacity="0.5" />
      <stop offset="0.5" stop-color="#8B5CF6" stop-opacity="1" />
      <stop offset="0.8" stop-color="#38BDF8" stop-opacity="0.5" />
      <stop offset="1" stop-color="#000000" stop-opacity="0" />
    </linearGradient>
    <filter id="dividerGlow" x="-20%" y="-400%" width="140%" height="900%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <radialGradient id="pulseGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#E9D5FF" />
      <stop offset="0.45" stop-color="#8B5CF6" />
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect x="0" y="13" width="1200" height="2" rx="1" fill="url(#dividerLine)" filter="url(#dividerGlow)" />
  <circle cx="120" cy="14" r="10" fill="url(#pulseGradient)" filter="url(#dividerGlow)">
    <animate attributeName="cx" values="120;1080;120" dur="5s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.4;1;0.4" dur="5s" repeatCount="indefinite" />
  </circle>
</svg>
